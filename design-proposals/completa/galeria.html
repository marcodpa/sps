<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SPS · Propuesta completa</title><link rel="stylesheet" href="style.css"></head><body class="gallery-body"><header class="header"><a class="brand" href="index.html"><img src="/assets/sps-oil-logo.png" alt="SPS"></a><strong>Propuesta completa del sitio</strong><a class="button" href="index.html">Recorrer el diseño</a></header><main><div class="gallery-head"><h1>Cinco páginas. Todo el contenido.</h1><p>28 pantallas con fotografías del proyecto, historia, servicios, trabajos y contacto. Abre una imagen para verla completa o recorre la propuesta con sus controles.</p><div class="gallery-filters" aria-label="Filtrar páginas"></div></div><div class="gallery-grid"></div></main><script type="module">
import {pages} from './views.js';
const filters=document.querySelector('.gallery-filters'),grid=document.querySelector('.gallery-grid');
filters.innerHTML=[{id:'todas',name:'Todas'},...pages].map(p=>`<button data-page="${p.id}" aria-pressed="${p.id==='todas'}">${p.name}</button>`).join('');
grid.innerHTML=pages.flatMap(p=>p.sections.map((s,i)=>`<figure data-page="${p.id}"><a href="capturas/${p.id}-${String(i+1).padStart(2,'0')}.png" target="_blank"><img loading="lazy" src="capturas/${p.id}-${String(i+1).padStart(2,'0')}.png" alt="${p.name}: ${s.name}"></a><figcaption><strong>${p.name} · ${i+1}. ${s.name}</strong><small><a href="index.html?pagina=${p.id}&seccion=${i}">Abrir pantalla interactiva</a></small></figcaption></figure>`)).join('');
filters.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;filters.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));grid.querySelectorAll('figure').forEach(x=>x.hidden=b.dataset.page!=='todas'&&x.dataset.page!==b.dataset.page)});
</script></body></html>
