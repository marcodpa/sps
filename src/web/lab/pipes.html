<!doctype html>
<html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lab · tuberías</title>
<style>
 html,body{margin:0;background:linear-gradient(#fbfdff,#e9f1fb)}
 #host{position:relative;width:100%;height:1300px;overflow:hidden}
 .pipes{position:absolute;left:0;top:0;pointer-events:none;filter:drop-shadow(8px 20px 14px rgba(20,52,96,.22))}
 .card{position:absolute;background:#fff;border-radius:14px;box-shadow:0 18px 40px -20px #254c7570;padding:24px;font:16px sans-serif;color:#0c2a55}
</style>
<div id="host">
 <div class="card" style="left:760px;top:120px;width:420px;height:180px;z-index:2">Tarjeta sobre la tubería (capa inferior)</div>
</div>
<script type="module">
 import {PipeStage} from '/src/web/lib/pipes/stage.js'
 const host=document.getElementById('host')
 new PipeStage(host,({W,H,D})=>[
  // A: hero-like run with valve + flanges, elbow down
  {layer:'under',D,pts:[[-40,330],[W*0.72,330],[W*0.72,520],[W+40,520]],r:D*1.1,
   parts:[{at:180,type:'pair'},{at:520,type:'valve',id:'wheel-a'},{at:760,type:'pair'},{at:'62%',type:'ring'}],ends:{end:'flange'}},
  // B: vertical drop with gauge and sight glass
  {layer:'over',D,pts:[[W*0.22,700],[W*0.22,900],[W*0.55,900],[W*0.55,1400]],r:D*1.1,
   parts:[{at:60,type:'pair'},{at:250,type:'gauge',dx:0},{at:620,type:'sight',len:D*1.8},{at:560,type:'flange',face:-1},{at:680,type:'flange',face:1}]}
 ])
</script>
